services:
  sandbox:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3100:3100"
    depends_on:
      - notify

  notify:
    platform: linux/amd64
    build:
      context: ./notify
      dockerfile: Dockerfile
    ports:
      - "3200:3200"
    environment:
      - NOTIFY_PORT=3200
      - NOTIFY_DB_PATH=./data/notify.db
    volumes:
      - notify-data:/app/data

volumes:
  notify-data:
